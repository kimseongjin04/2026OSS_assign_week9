<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>도서 관리</h1>
        <a href="index.html">Home</a>
        <h2>도서 입력</h2>
        <form id="bookForm">
            <label>제목 <input type="text" id="title"></label>
            <label>저자 <input type="text" id="author"></label>
            <label>출판연도 <input type="number" id="year"></label>
            <label>장르 <input type="text" id="genre"></label>
            <label>평점 <input type="number" id="rating"></label>
 
            <button type="submit" id="submitBtn">추가</button>
        </form>
        <p id="message"></p>
 
        <h2>도서 목록</h2>
        <input type="text" id="search" placeholder="제목으로 검색">
        <ul id="bookList"></ul>
    </div>
 
    <script src="app.js"></script>
</body>
</html>
